<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="Playful learning games for kids ages 2 to 10: shapes, colors, counting, letters, spelling, math and coloring.">
  <title>Little Learners Arcade</title>

  <!-- Progressive Web App -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Learners">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Little Learners">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Self-hosted font (Fredoka, SIL OFL) so the app works fully offline -->
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>

  <!-- Core engine first, then each game registers itself, then the app shell. -->
  <script src="js/core.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/games/shapes.js"></script>
  <script src="js/games/counting.js"></script>
  <script src="js/games/letters.js"></script>
  <script src="js/games/spelling.js"></script>
  <script src="js/games/math.js"></script>
  <script src="js/games/coloring-pages.js"></script>
  <script src="js/games/coloring.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
